name: PDP Feature Monitor

on:
  # Run daily at 8:00 UTC (5:00 BRT)
  schedule:
    - cron: "0 8 * * *"

  # Allow manual trigger with optional filters
  workflow_dispatch:
    inputs:
      features_filter:
        description: "Features a verificar (separadas por vírgula, vazio = todas)"
        required: false
        default: ""
        type: string
      operations_filter:
        description: "Operações a verificar (ex: natura-BR,avon-BR, vazio = todas)"
        required: false
        default: ""
        type: string
      send_email_always:
        description: "Enviar e-mail mesmo se tudo passar"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🎭 Install Playwright browsers
        run: npx playwright install chromium firefox --with-deps

      - name: 🔍 Run PDP checks
        id: checks
        run: npm run check
        env:
          FEATURES_FILTER: ${{ inputs.features_filter }}
          OPERATIONS_FILTER: ${{ inputs.operations_filter }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_CLIENT_EMAIL: ${{ secrets.FIREBASE_CLIENT_EMAIL }}
          FIREBASE_PRIVATE_KEY: ${{ secrets.FIREBASE_PRIVATE_KEY }}
        continue-on-error: true

      - name: 📊 Find report directory
        id: find_report
        run: |
          # The check script writes directly to docs/reports/run_*/
          REPORT_DIR=$(ls -td docs/reports/run_* 2>/dev/null | head -1)
          echo "report_dir=$REPORT_DIR" >> $GITHUB_OUTPUT
          if [ -f "$REPORT_DIR/report.json" ]; then
            SUMMARY=$(cat "$REPORT_DIR/report.json" | jq -r '"Total: \(.summary.total), Passed: \(.summary.passed), Failed: \(.summary.failed), Errors: \(.summary.errors)"')
            echo "summary=$SUMMARY" >> $GITHUB_OUTPUT
          fi

      - name: 📤 Upload report artifact
        uses: actions/upload-artifact@v4
        with:
          name: pdp-monitor-report-${{ github.run_number }}
          path: ${{ steps.find_report.outputs.report_dir }}
          retention-days: 30

      - name: 🌐 Publish report to GitHub Pages
        run: |
          # The check script already writes reports to docs/reports/run_*/ and
          # updates docs/reports/index.json.  We only need to refresh the
          # last-report shortcuts and commit everything in docs/.
          REPORT_DIR=$(ls -td docs/reports/run_* 2>/dev/null | head -1)
          if [ ! -f "$REPORT_DIR/report.html" ]; then
            echo "⚠️  No report found in docs/reports/ — skipping publish"
            exit 0
          fi

          # Update last-report shortcuts
          cp "$REPORT_DIR/report.html" docs/last-report.html
          cp "$REPORT_DIR/report.json" docs/last-report.json
          echo "✅ Índice de relatórios atualizado: $(pwd)/docs/reports/index.json"

          # Commit and push all docs/ changes (new run dir + index.json + last-report)
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f docs/
          git diff --staged --quiet || git commit -m "chore: update last report [run #${{ github.run_number }}]"
          git pull --rebase origin ${{ github.ref_name }} || true
          git push origin HEAD:${{ github.ref_name }}
          echo "✅ Report published to GitHub Pages"

      - name: 📤 Upload Pages artifact (static reports)
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: 🚀 Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4

      - name: 📧 Send email notification (on failure)
        if: steps.checks.outcome == 'failure' || inputs.send_email_always == 'true'
        uses: dawidd6/action-send-mail@v3
        continue-on-error: true
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT }}
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "🔴 PDP Monitor Alert - Features fora do ar"
          to: ${{ secrets.ALERT_EMAIL_TO }}
          from: ${{ secrets.ALERT_EMAIL_FROM }}
          body: |
            ⚠️ O monitoramento de PDPs detectou problemas!

            📊 Resumo: ${{ steps.find_report.outputs.summary }}

            📅 Execução: ${{ github.run_number }}
            🔗 Workflow: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            Acesse o report no site: https://sites.google.com/natura.net/checagem-features-pdp

            Verifique o relatório completo no artifact do workflow.
          attachments: ${{ steps.find_report.outputs.report_dir }}/report.html

      - name: ✅ Check final status
        if: steps.checks.outcome == 'failure'
        run: exit 1
