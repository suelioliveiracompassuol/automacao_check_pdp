name: PDP Feature Monitor

on:
  # Run daily at 5:00 UTC (2:00 BRT)
  schedule:
    - cron: "0 5 * * *"

  # Allow manual trigger with optional filters
  workflow_dispatch:
    inputs:
      features_filter:
        description: "Features a verificar (separadas por vírgula, vazio = todas)"
        required: false
        default: ""
        type: string
      operations_filter:
        description: "Operações a verificar (ex: natura-BR,avon-BR, vazio = todas)"
        required: false
        default: ""
        type: string
      send_email_always:
        description: "Enviar e-mail mesmo se tudo passar"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  monitor:
    # Fixado: o ubuntu-latest passou a ser o 26.04 (out/2026), que o Playwright 1.59 não suporta
    # ("Playwright does not support chromium on ubuntu26.04-x64"). Rever ao atualizar o Playwright.
    runs-on: ubuntu-24.04
    # Folga para lentidão de infra (apt/mirror) não cancelar o monitor antes dos checks
    timeout-minutes: 50
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          # Raso: o histórico completo (reports commitados) leva ~6 min; o push só precisa do pull --rebase
          fetch-depth: 1
          ref: ${{ github.ref_name }}

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔖 Get Playwright version
        id: pw_version
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> $GITHUB_OUTPUT

      - name: 💾 Cache Playwright browsers
        id: pw_cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-24.04-${{ steps.pw_version.outputs.version }}-chromium-firefox

      - name: 🎭 Install Playwright browsers
        if: steps.pw_cache.outputs.cache-hit != 'true'
        timeout-minutes: 15
        run: npx playwright install chromium firefox --with-deps

      - name: 🎭 Install Playwright system deps (cache hit)
        if: steps.pw_cache.outputs.cache-hit == 'true'
        timeout-minutes: 15
        run: npx playwright install-deps chromium firefox

      - name: ⏱️ Mark run start
        id: start
        run: echo "ms=$(date +%s%3N)" >> $GITHUB_OUTPUT

      - name: 🔍 Run PDP checks (Web)
        id: checks
        run: npm run check
        env:
          FEATURES_FILTER: ${{ inputs.features_filter }}
          OPERATIONS_FILTER: ${{ inputs.operations_filter }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_CLIENT_EMAIL: ${{ secrets.FIREBASE_CLIENT_EMAIL }}
          FIREBASE_PRIVATE_KEY: ${{ secrets.FIREBASE_PRIVATE_KEY }}
        continue-on-error: true

      - name: 📊 Find report directory
        id: find_report
        run: |
          # Web writes to docs/reports/run_<timestamp>/ (Android runs live in their own workflow)
          REPORT_DIR=$(ls -d docs/reports/run_[0-9]* 2>/dev/null | sort -t_ -k2 -n | tail -1)
          # Only a report written by this run counts: when the monitor dies before the checks
          # (build error, crash) the newest dir is an older run, whose summary would be misleading.
          TS=${REPORT_DIR##*run_}
          if [ -f "$REPORT_DIR/report.json" ] && [ "$TS" -ge "${{ steps.start.outputs.ms }}" ]; then
            echo "fresh=true" >> $GITHUB_OUTPUT
            echo "report_dir=$REPORT_DIR" >> $GITHUB_OUTPUT
            SUMMARY=$(cat "$REPORT_DIR/report.json" | jq -r '"Total: \(.summary.total), Passed: \(.summary.passed), Failed: \(.summary.failed), Errors: \(.summary.errors)"')
            echo "summary=$SUMMARY" >> $GITHUB_OUTPUT
          else
            echo "fresh=false" >> $GITHUB_OUTPUT
            echo "⚠️  Esta execução não gerou relatório (o monitor falhou antes dos checks)"
          fi

      - name: 📤 Upload report artifact (Web)
        if: steps.find_report.outputs.fresh == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: pdp-monitor-report-${{ github.run_number }}
          path: ${{ steps.find_report.outputs.report_dir }}
          retention-days: 30

      - name: 🧹 Remove old screenshots and HTML reports
        run: |
          # Web runs only (run_<ts>); Android runs are cleaned by android-check.yml.
          # Run dir names carry the timestamp; file mtimes are reset by checkout.
          CUTOFF=$(( ($(date +%s) - 10 * 86400) * 1000 ))
          for dir in docs/reports/run_[0-9]*/; do
            [ -d "$dir" ] || continue
            ts=$(basename "$dir"); ts=${ts#run_}
            [[ "$ts" =~ ^[0-9]+$ ]] || continue
            if (( ts < CUTOFF )); then
              find "$dir" -type f \( -name '*.png' -o -name '*.html' \) -delete
              find "$dir" -mindepth 1 -type d -empty -delete
            fi
          done

      - name: 🌐 Publish report to GitHub Pages
        run: |
          # The check script already writes the report to docs/reports/run_<ts>/ and updates
          # docs/reports/index.json. last-report.json is the Web shortcut the dashboard Home
          # page reads directly.
          # Newest run by the timestamp in its name, not by mtime: the cleanup step above deletes
          # files from old run dirs, which bumps their mtime and made `ls -t` pick a stale run.
          REPORT_DIR=$(ls -d docs/reports/run_[0-9]* 2>/dev/null | sort -t_ -k2 -n | tail -1)
          if [ ! -f "$REPORT_DIR/report.json" ]; then
            echo "⚠️  No report found in docs/reports/ — skipping publish"
            exit 0
          fi

          # Update last-report shortcut
          cp "$REPORT_DIR/report.json" docs/last-report.json
          echo "✅ Índice de relatórios atualizado: $(pwd)/docs/reports/index.json"

          # Commit and push the Web changes (new run dir + index.json + last-report). Android
          # (run_android_*, index.android.json) and perf (docs/perf) are committed by their own
          # workflows, so they're left out here.
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f docs/last-report.json docs/reports/index.json
          git add -f -A -- 'docs/reports/run_[0-9]*'
          git diff --staged --quiet || git commit -m "chore: update last report [run #${{ github.run_number }}]"
          git pull --rebase origin ${{ github.ref_name }} || true
          git push origin HEAD:${{ github.ref_name }}
          echo "✅ Report published to GitHub Pages"

      - name: 📤 Upload Pages artifact (static reports)
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: 🚀 Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4

      - name: 📧 Send email notification (on failure)
        if: steps.checks.outcome == 'failure' || inputs.send_email_always == 'true'
        uses: dawidd6/action-send-mail@v3
        continue-on-error: true
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT }}
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: ${{ steps.find_report.outputs.fresh == 'true' && '🔴 PDP Monitor Alert - Features fora do ar' || '🔴 PDP Monitor Alert - Execução falhou antes dos checks' }}
          to: ${{ secrets.ALERT_EMAIL_TO }}
          from: ${{ secrets.ALERT_EMAIL_FROM }}
          body: |
            ${{ steps.find_report.outputs.fresh == 'true' && '⚠️ O monitoramento de PDPs detectou problemas!' || '⚠️ O monitor não chegou a rodar os checks (erro de build ou de execução) — veja o log do workflow. Nenhum relatório novo foi gerado.' }}

            🌐 Resumo (Web): ${{ steps.find_report.outputs.summary || 'sem relatório nesta execução' }}

            📅 Execução do workflow: #${{ github.run_number }}
            🔗 Workflow: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            Acesse o report no site: https://sites.google.com/natura.net/checagem-features-pdp

            📊 Dashboard: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/web

      - name: ✅ Check final status
        if: steps.checks.outcome == 'failure'
        run: exit 1
