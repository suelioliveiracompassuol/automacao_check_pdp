name: PDP Feature Monitor

on:
  # Run daily at 8:00 UTC (5:00 BRT)
  schedule:
    - cron: "0 8 * * *"

  # Allow manual trigger with optional filters
  workflow_dispatch:
    inputs:
      features_filter:
        description: "Features a verificar (separadas por vírgula, vazio = todas)"
        required: false
        default: ""
        type: string
      operations_filter:
        description: "Operações a verificar (ex: natura-BR,avon-BR, vazio = todas)"
        required: false
        default: ""
        type: string
      send_email_always:
        description: "Enviar e-mail mesmo se tudo passar"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🎭 Install Playwright browsers
        run: npx playwright install chromium firefox --with-deps

      - name: 🔍 Run PDP checks (Web)
        id: checks
        run: npm run check
        env:
          FEATURES_FILTER: ${{ inputs.features_filter }}
          OPERATIONS_FILTER: ${{ inputs.operations_filter }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_CLIENT_EMAIL: ${{ secrets.FIREBASE_CLIENT_EMAIL }}
          FIREBASE_PRIVATE_KEY: ${{ secrets.FIREBASE_PRIVATE_KEY }}
        continue-on-error: true

      - name: 📱 Run PDP checks (Android)
        id: android_checks
        run: npm run check:android
        env:
          OPERATIONS_FILTER: ${{ inputs.operations_filter }}
          # Device farm (required — GitHub-hosted runners have no Android virtualization)
          DEVICE_FARM_PROVIDER: ${{ vars.DEVICE_FARM_PROVIDER || 'lambdatest' }}
          BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
          BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
          BROWSERSTACK_APP_ID: ${{ secrets.BROWSERSTACK_APP_ID }}
          LAMBDATEST_USERNAME: ${{ secrets.LAMBDATEST_USERNAME }}
          LAMBDATEST_ACCESS_KEY: ${{ secrets.LAMBDATEST_ACCESS_KEY }}
          LAMBDATEST_APP_ID: ${{ secrets.LAMBDATEST_APP_ID }}
          # Firebase Remote Config do app mobile (projeto distinto do Firestore usado pelo Web)
          ANDROID_FIREBASE_PROJECT_ID: ${{ secrets.ANDROID_FIREBASE_PROJECT_ID }}
          ANDROID_FIREBASE_PROJECT_NUMBER: ${{ secrets.ANDROID_FIREBASE_PROJECT_NUMBER }}
          ANDROID_FIREBASE_API_KEY: ${{ secrets.ANDROID_FIREBASE_API_KEY }}
          ANDROID_FIREBASE_APP_ID: ${{ secrets.ANDROID_FIREBASE_APP_ID }}
          ANDROID_FIREBASE_PACKAGE_NAME: ${{ secrets.ANDROID_FIREBASE_PACKAGE_NAME }}
          ANDROID_FIREBASE_APPS_JSON: ${{ secrets.ANDROID_FIREBASE_APPS_JSON }}
          # Login opcional (roda anônimo se não definido) e seleção de SKUs/concorrência
          ANDROID_LOGIN_EMAIL: ${{ secrets.ANDROID_LOGIN_EMAIL }}
          ANDROID_LOGIN_PASSWORD: ${{ secrets.ANDROID_LOGIN_PASSWORD }}
          ANDROID_SKUS: ${{ vars.ANDROID_SKUS }}
          ANDROID_CONCURRENCY: ${{ vars.ANDROID_CONCURRENCY }}
        # POC ainda dependente de device farm externo — não deve travar o job caso falhe
        continue-on-error: true

      - name: 📊 Find report directories
        id: find_report
        run: |
          # Web writes to docs/reports/run_<timestamp>/, Android to docs/reports/run_android_<timestamp>/
          REPORT_DIR=$(ls -td docs/reports/run_[0-9]* 2>/dev/null | head -1)
          ANDROID_REPORT_DIR=$(ls -td docs/reports/run_android_* 2>/dev/null | head -1)
          echo "report_dir=$REPORT_DIR" >> $GITHUB_OUTPUT
          echo "android_report_dir=$ANDROID_REPORT_DIR" >> $GITHUB_OUTPUT
          if [ -f "$REPORT_DIR/report.json" ]; then
            SUMMARY=$(cat "$REPORT_DIR/report.json" | jq -r '"Total: \(.summary.total), Passed: \(.summary.passed), Failed: \(.summary.failed), Errors: \(.summary.errors)"')
            echo "summary=$SUMMARY" >> $GITHUB_OUTPUT
          fi
          if [ -f "$ANDROID_REPORT_DIR/report.json" ]; then
            ANDROID_SUMMARY=$(cat "$ANDROID_REPORT_DIR/report.json" | jq -r '"Total: \(.summary.total), Passed: \(.summary.passed), Failed: \(.summary.failed), Errors: \(.summary.errors)"')
            echo "android_summary=$ANDROID_SUMMARY" >> $GITHUB_OUTPUT
          fi

      - name: 📤 Upload report artifact (Web)
        uses: actions/upload-artifact@v4
        with:
          name: pdp-monitor-report-${{ github.run_number }}
          path: ${{ steps.find_report.outputs.report_dir }}
          retention-days: 30

      - name: 📤 Upload report artifact (Android)
        if: steps.find_report.outputs.android_report_dir != ''
        uses: actions/upload-artifact@v4
        with:
          name: pdp-monitor-report-android-${{ github.run_number }}
          path: ${{ steps.find_report.outputs.android_report_dir }}
          retention-days: 30

      - name: 🌐 Publish report to GitHub Pages
        run: |
          # The check scripts already write reports to docs/reports/run_*/ (web) and
          # docs/reports/run_android_*/ (android), and both update docs/reports/index.json.
          # last-report.html/json is a Web-only shortcut (the dashboard Home page reads it
          # directly), so it must always come from the Web run dir, never the Android one.
          REPORT_DIR=$(ls -td docs/reports/run_[0-9]* 2>/dev/null | head -1)
          if [ ! -f "$REPORT_DIR/report.html" ]; then
            echo "⚠️  No report found in docs/reports/ — skipping publish"
            exit 0
          fi

          # Update last-report shortcuts
          cp "$REPORT_DIR/report.html" docs/last-report.html
          cp "$REPORT_DIR/report.json" docs/last-report.json
          echo "✅ Índice de relatórios atualizado: $(pwd)/docs/reports/index.json"

          # Commit and push all docs/ changes (new run dir + index.json + last-report)
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f docs/
          git diff --staged --quiet || git commit -m "chore: update last report [run #${{ github.run_number }}]"
          git pull --rebase origin ${{ github.ref_name }} || true
          git push origin HEAD:${{ github.ref_name }}
          echo "✅ Report published to GitHub Pages"

      - name: 📤 Upload Pages artifact (static reports)
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: 🚀 Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4

      - name: 📧 Send email notification (on failure)
        if: steps.checks.outcome == 'failure' || steps.android_checks.outcome == 'failure' || inputs.send_email_always == 'true'
        uses: dawidd6/action-send-mail@v3
        continue-on-error: true
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT }}
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "🔴 PDP Monitor Alert - Features fora do ar"
          to: ${{ secrets.ALERT_EMAIL_TO }}
          from: ${{ secrets.ALERT_EMAIL_FROM }}
          body: |
            ⚠️ O monitoramento de PDPs detectou problemas!

            🌐 Resumo (Web): ${{ steps.find_report.outputs.summary }}
            📱 Resumo (Android): ${{ steps.find_report.outputs.android_summary || 'sem execução' }}

            📅 Execução: ${{ github.run_number }}
            🔗 Workflow: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            Acesse o report no site: https://sites.google.com/natura.net/checagem-features-pdp

            Verifique o relatório completo no artifact do workflow.
          attachments: ${{ steps.find_report.outputs.report_dir }}/report.html

      - name: ✅ Check final status
        if: steps.checks.outcome == 'failure'
        run: exit 1
